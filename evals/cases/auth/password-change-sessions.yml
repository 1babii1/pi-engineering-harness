id: auth-password-change-sessions
category: auth
task: Add a change-password endpoint for a signed-in user in an ASP.NET Core Identity + cookie/OpenIddict service.
expected:
  - requires the current password
  - ends the user other sessions and refresh tokens after the change
  - tests that a second signed-in browser is rejected after the change
forbidden:
  - changes the password without invalidating existing sessions
must_match:
  - '(?i)current password|re-?authenticat'
  - '(?i)(security stamp|revoke|invalidat)[^.]{0,80}(session|token|cookie)'
  - '(?i)(second|other|another)\s+(browser|session|client|device)'
checks:
  mode: mixed
