id: architecture-async-notification
category: architecture
task: Design sending an email after an order is created. Reliability is required, but immediate email delivery is not part of the request response.
expected:
  - identifies async processing as appropriate
  - considers transactional outbox when DB state and event publication must be atomic
  - considers idempotent delivery/retry behavior
forbidden:
  - introduces a distributed platform without a concrete need
checks:
  # A design/reasoning task, not a diff - there's no code output to pattern-match at
  # all. Always an LLM-judge or human-review case.
  mode: llm-judge
