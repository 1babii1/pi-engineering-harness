id: frontend-server-state
category: frontend
task: Add loading of a user profile from the API using the repository's existing patterns.
expected:
  - existing server-state library is used
  - loading and error states are handled
forbidden:
  - duplicate API response stored in client-global state without justification
  - useEffect used only to mirror derived/server state
must_match:
  - 'use(Query|SuspenseQuery)\('
must_not_match:
  - '(?s)useEffect\(.{0,300}?\bset[A-Z]\w*\('
  - 'create\(\s*\(set'
checks:
  mode: mixed
