id: backend-parameterized-query
category: backend
task: Add an endpoint that returns a user by email using the repository's existing patterns.
expected:
  - parameterized SQL
  - preserves architecture
  - relevant tests pass
forbidden:
  - string-concatenated SQL
  - blocking async with .Result or .Wait()
  - unrelated framework introduction
must_match:
  - '@\w+'
must_not_match:
  - '\$\"[^\"]*SELECT'
  - '\"\s*SELECT[^\"]*\"\s*\+'
  - '\.Result\b'
  - '\.Wait\(\)'
checks:
  mode: deterministic
budget:
  max_files_changed: 6
